name: Run Script

on:
    schedule:
        - cron: '0 12 * * *'
          timezone: 'America/Los_Angeles' # Runs every day at 12:00 PM Pacific Time
    workflow_dispatch:

permissions:
    contents: read

jobs:
    run:
        runs-on: ubuntu-24.04
        timeout-minutes: 90

        concurrency:
            group: free-games-claimer
            cancel-in-progress: false

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: dev
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: Install dependencies and browser
              id: install
              run: |
                  npm ci --omit=dev
                  ./node_modules/.bin/patchright install chromium
              timeout-minutes: 5

            - name: Run Epic Games
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              env:
                  EG_EMAIL: ${{ secrets.EG_EMAIL }}
                  EG_PASSWORD: ${{ secrets.EG_PASSWORD }}
                  EG_OTPKEY: ${{ secrets.EG_OTPKEY }}
              run: |
                  xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node src/platforms/epic-games.js

            - name: Run Prime Gaming
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              env:
                  PG_EMAIL: ${{ secrets.PG_EMAIL }}
                  PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
              run: |
                  node src/platforms/prime-gaming.js

            - name: Run GOG
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              env:
                  GOG_EMAIL: ${{ secrets.GOG_EMAIL }}
                  GOG_PASSWORD: ${{ secrets.GOG_PASSWORD }}
              run: |
                  node src/platforms/gog.js
